<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Flow Board</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="header-brand">
      <span class="brand-logo">⚡</span>
      <span class="brand-name">Quest Flow</span>
    </div>
    <nav class="view-tabs">
      <button class="tab-btn active" data-view="board">⊞ Board</button>
      <button class="tab-btn" data-view="dashboard">📅 Dashboard</button>
    </nav>
    <div class="header-controls">
      <input type="text" id="search-input" class="ctrl-input" placeholder="🔍 ค้นหา...">
      <select id="filter-priority" class="ctrl-select">
        <option value="">Priority ทั้งหมด</option>
        <option value="urgent">🔴 Urgent</option>
        <option value="high">🟠 High</option>
        <option value="medium">🔵 Medium</option>
        <option value="low">⚪ Low</option>
      </select>
      <select id="filter-tag" class="ctrl-select">
        <option value="">Tags ทั้งหมด</option>
      </select>
      <select id="sort-select" class="ctrl-select">
        <option value="default">เรียง: Default</option>
        <option value="dueDate">Due Date</option>
        <option value="priority">Priority</option>
        <option value="name">ชื่อ A-Z</option>
        <option value="progress">Progress</option>
      </select>
      <button id="btn-add-task" class="btn btn-primary">+ งาน</button>
      <button id="btn-manage-tags" class="btn btn-outline">🏷 Tags</button>
      <button id="btn-add-group" class="btn btn-outline">+ กลุ่ม</button>
      <button id="btn-reset" class="btn btn-outline btn-icon" title="Reset ข้อมูล">↺</button>
    </div>
  </header>

  <div id="view-board" class="view-pane">
    <div id="board-content"></div>
  </div>

  <div id="view-dashboard" class="view-pane hidden">
    <div id="dashboard-content"></div>
  </div>
</div>

<!-- Task Modal -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div id="task-modal" class="task-modal">
    <div class="modal-header">
      <div class="modal-title-row">
        <button id="modal-color-btn" class="task-color-chip" title="เปลี่ยนสี"></button>
        <input type="text" id="modal-name" class="modal-name-input" placeholder="ชื่องาน...">
        <button id="modal-close" class="icon-btn" title="ปิด">✕</button>
      </div>
      <div class="modal-meta-bar">
        <label class="meta-field">
          <span class="meta-label">กลุ่ม</span>
          <select id="modal-group" class="meta-select"></select>
        </label>
        <label class="meta-field">
          <span class="meta-label">Priority</span>
          <select id="modal-priority" class="meta-select">
            <option value="urgent">🔴 Urgent</option>
            <option value="high">🟠 High</option>
            <option value="medium">🔵 Medium</option>
            <option value="low">⚪ Low</option>
          </select>
        </label>
        <label class="meta-field">
          <span class="meta-label">Due Date (งาน)</span>
          <input type="date" id="modal-duedate" class="meta-input">
        </label>
      </div>
      <div class="modal-tags-bar">
        <span class="meta-label">Tags:</span>
        <div id="modal-tags" class="tags-row"></div>
        <button id="modal-add-tag" class="tag-add-pill">+ Tag</button>
      </div>
      <textarea id="modal-notes" class="modal-notes" placeholder="Notes / หมายเหตุ..."></textarea>
    </div>

    <div class="modal-body">
      <div class="modal-section">
        <div class="section-hdr">
          <h3 class="section-title">Steps / Flow</h3>
          <div class="section-btns">
            <button id="btn-add-step" class="btn btn-sm btn-primary">+ Step</button>
            <button id="btn-add-parallel" class="btn btn-sm btn-outline">⊕ Parallel</button>
          </div>
        </div>
        <div id="steps-list" class="steps-list"></div>
      </div>

      <div class="modal-section">
        <div class="section-hdr">
          <h3 class="section-title">Attachments</h3>
          <label class="btn btn-sm btn-outline">
            📎 อัปโหลด
            <input type="file" id="attach-input" multiple
              accept=".pdf,.jpg,.jpeg,.png,.eml,.msg,image/*" hidden>
          </label>
        </div>
        <div id="attach-zone" class="attach-zone">
          <div id="attach-list" class="attach-list"></div>
          <div class="attach-hint">📋 Ctrl+V วางรูปจาก Clipboard | ลากไฟล์มาวาง | รองรับ PDF PNG JPEG .eml</div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button id="modal-delete" class="btn btn-danger-outline">🗑 ลบงาน</button>
      <div>
        <button id="modal-cancel" class="btn btn-outline">ยกเลิก</button>
        <button id="modal-save" class="btn btn-primary">💾 บันทึก</button>
      </div>
    </div>
  </div>
</div>

<!-- Color Picker Popover -->
<div id="color-popover" class="color-popover hidden">
  <div id="color-grid" class="color-grid"></div>
  <div class="color-custom-row">
    <input type="color" id="custom-color" value="#4A90D9">
    <span>กำหนดเอง</span>
  </div>
  <button id="color-clear" class="btn btn-sm btn-outline" style="width:100%;margin-top:6px">ล้างสี</button>
</div>

<!-- Image Lightbox -->
<div id="img-lightbox" class="img-lightbox hidden">
  <div class="lightbox-backdrop"></div>
  <img id="lightbox-img" class="lightbox-img" alt="">
  <button id="lightbox-close" class="lightbox-close" title="ปิด">✕</button>
</div>

<!-- Tag Picker -->
<div id="tag-picker" class="tag-picker hidden">
  <div id="tag-picker-list"></div>
  <div class="tag-picker-footer">
    <button id="go-manage-tags" class="link-btn">⚙ จัดการ Tags</button>
  </div>
</div>

<!-- Tag Manager -->
<div id="tag-manager-overlay" class="modal-overlay hidden">
  <div class="mini-modal">
    <div class="mini-modal-hdr">
      <h3>🏷 จัดการ Tags</h3>
      <button class="icon-btn" id="close-tag-manager">✕</button>
    </div>
    <div class="mini-modal-body">
      <div id="tag-manager-list"></div>
      <div class="new-row">
        <input type="text" id="new-tag-name" class="meta-input" placeholder="ชื่อ Tag...">
        <input type="color" id="new-tag-color" value="#4A90D9">
        <button id="btn-create-tag" class="btn btn-sm btn-primary">+ สร้าง</button>
      </div>
    </div>
  </div>
</div>

<!-- Add Group -->
<div id="add-group-overlay" class="modal-overlay hidden">
  <div class="mini-modal">
    <div class="mini-modal-hdr">
      <h3>+ เพิ่มกลุ่ม</h3>
      <button class="icon-btn" id="close-add-group">✕</button>
    </div>
    <div class="mini-modal-body">
      <div class="new-row">
        <input type="text" id="new-group-name" class="meta-input" placeholder="ชื่อกลุ่ม...">
        <input type="color" id="new-group-color" value="#185FA5">
        <button id="btn-create-group" class="btn btn-sm btn-primary">+ สร้าง</button>
      </div>
    </div>
  </div>
</div>

<!-- Step Attachment Modal -->
<div id="step-attach-overlay" class="modal-overlay hidden">
  <div class="mini-modal" style="width:560px">
    <div class="mini-modal-hdr">
      <h3>📎 Attachments — <span id="step-attach-title"></span></h3>
      <button class="icon-btn" id="close-step-attach">✕</button>
    </div>
    <div class="mini-modal-body">
      <div style="margin-bottom:8px">
        <label class="btn btn-sm btn-outline">
          📎 อัปโหลด
          <input type="file" id="step-attach-input" multiple
            accept=".pdf,.jpg,.jpeg,.png,.eml,.msg,image/*" hidden>
        </label>
        <span style="margin-left:8px;color:var(--text-muted);font-size:12px">หรือ Paste รูป (Ctrl+V) ได้เลย</span>
      </div>
      <div id="step-attach-zone" class="attach-zone" style="min-height:80px">
        <div id="step-attach-list" class="attach-list"></div>
        <div class="attach-hint">📋 Ctrl+V วางรูป | ลากไฟล์มาวาง</div>
      </div>
    </div>
  </div>
</div>

<script src="js/initialData.js"></script>
<script src="js/store.js"></script>
<script src="js/board.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>

<!-- สคริปต์จุดชนวนเรียกให้ระบบเริ่มทำงาน -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof App !== 'undefined' && App.init) {
      App.init();
    }
  });
</script>
</body>
</html>
